name: sonar

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0
      # O SonarQube Cloud exige Java 21 ou mais novo desde 20/07/2026
      # (o suporte ao Java 17 foi removido). O passo e obrigatorio para
      # qualquer stack: sem ele a analise falha com "Java 17 is not
      # supported".
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Brendontailor_portfolio
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/vendor/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/coverage/**,**/*.min.js,**/*.min.css
            -Dsonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/vendor/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/coverage/**,**/*.min.js,**/*.min.css
            -Dsonarqube.qualitygate.wait=true
