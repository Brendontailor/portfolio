    <rect x="104" width="82" height="36" rx="18" fill="#ffffff" fill-opacity="0.12"/>
    <text x="145" y="24" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Vite</text>
