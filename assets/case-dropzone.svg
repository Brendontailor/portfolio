  <text x="64" y="238" fill="#f97316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">E-commerce de streetwear</text>
  <text x="64" y="304" fill="#d6d3d1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Vitrine, catálogo, carrinho, favoritos e login, com módulos</text>
  <text x="64" y="332" fill="#d6d3d1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">de backend para auth, admin, avaliações, WhatsApp e IA.</text>
